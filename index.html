<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Demo</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
        canvas { display: block; }
        #info { position: absolute; bottom: 20px; color: #0f0; font-family: "Courier New", monospace; font-size: 14px; text-align: center; }
        .btn { position: absolute; background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px 16px; font-family: "Courier New", monospace; font-size: 14px; cursor: pointer; }
        .btn:hover { background: #0f0; color: #000; }
        #btn { top: 20px; right: 20px; }
        #themeBtn { top: 20px; right: 180px; }
        #controls { position: absolute; top: 50px; left: 20px; color: #0f0; font-family: "Courier New", monospace; font-size: 11px; opacity: 0.7; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <button class="btn" id="btn" onclick="toggleView()">COCKPIT VIEW</button>
    <button class="btn" id="themeBtn" onclick="cycleTheme()">THEME: GREEN</button>
    <div id="controls">ARROWS: STEER SHIP</div>
    <div id="info">ELITE - WIREFRAME DEMO</div>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        // Cobra Mk III -tyylinen alus (yksinkertaistettu)
        const ship = {
            vertices: [
                [0, 0, 60],     // nokka
                [-40, 0, -30],  // vasen taka
                [40, 0, -30],   // oikea taka
                [0, -15, -20],  // ylä
                [0, 10, -20],   // ala
                [-20, 0, -30],  // vasen sisä taka
                [20, 0, -30],   // oikea sisä taka
                [-15, -8, 20],  // vasen ylä keski
                [15, -8, 20],   // oikea ylä keski
                [-15, 5, 20],   // vasen ala keski
                [15, 5, 20],    // oikea ala keski
            ],
            edges: [
                [0, 1], [0, 2], [0, 3], [0, 4],
                [1, 3], [2, 3], [1, 4], [2, 4],
                [1, 2], [3, 5], [3, 6], [4, 5], [4, 6],
                [5, 6], [0, 7], [0, 8], [0, 9], [0, 10],
                [7, 8], [9, 10], [7, 9], [8, 10],
            ]
        };

        // Tähdet taustalle
        const stars = Array.from({length: 200}, () => ({
            x: Math.random() * 800 - 400,
            y: Math.random() * 600 - 300,
            z: Math.random() * 500 + 100
        }));

        // Väriteemat (Issue #2)
        const themes = [
            { name: 'GREEN', color: '#0f0' },
            { name: 'AMBER', color: '#ffa500' },
            { name: 'CYAN', color: '#0ff' },
            { name: 'WHITE', color: '#fff' },
            { name: 'RED', color: '#f44' },
        ];
        let currentTheme = 0;
        let themeColor = themes[0].color;

        function cycleTheme() {
            currentTheme = (currentTheme + 1) % themes.length;
            themeColor = themes[currentTheme].color;
            document.getElementById('themeBtn').textContent = 'THEME: ' + themes[currentTheme].name;
            // Päivitä UI-elementtien värit
            document.querySelectorAll('.btn').forEach(b => {
                b.style.color = themeColor;
                b.style.borderColor = themeColor;
            });
            document.getElementById('info').style.color = themeColor;
            document.getElementById('controls').style.color = themeColor;
        }

        // Nuolinäppäinohjaus (Issue #3)
        let shipRotX = 0, shipRotY = 0;
        let inputX = 0, inputY = 0;
        const keys = {};

        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            e.preventDefault();
        });
        document.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        function updateInput() {
            const turnSpeed = 0.015;
            if (keys['ArrowLeft']) inputY -= turnSpeed;
            if (keys['ArrowRight']) inputY += turnSpeed;
            if (keys['ArrowUp']) inputX -= turnSpeed;
            if (keys['ArrowDown']) inputX += turnSpeed;
            // Vaimeneminen
            inputX *= 0.95;
            inputY *= 0.95;
            shipRotX += inputX;
            shipRotY += inputY;
        }

        let angleX = 0, angleY = 0, angleZ = 0;
        let cockpitView = false;

        function toggleView() {
            cockpitView = !cockpitView;
            document.getElementById('btn').textContent = cockpitView ? 'EXTERIOR VIEW' : 'COCKPIT VIEW';
            document.getElementById('info').textContent = cockpitView ? 'COMMANDER JAMESON' : 'ELITE - WIREFRAME DEMO';
        }

        function rotateX(v, a) {
            const cos = Math.cos(a), sin = Math.sin(a);
            return [v[0], v[1]*cos - v[2]*sin, v[1]*sin + v[2]*cos];
        }
        function rotateY(v, a) {
            const cos = Math.cos(a), sin = Math.sin(a);
            return [v[0]*cos + v[2]*sin, v[1], -v[0]*sin + v[2]*cos];
        }
        function rotateZ(v, a) {
            const cos = Math.cos(a), sin = Math.sin(a);
            return [v[0]*cos - v[1]*sin, v[0]*sin + v[1]*cos, v[2]];
        }

        function project(v) {
            const fov = 300;
            const z = v[2] + 200;
            if (z <= 0) return null;
            const scale = fov / z;
            return [v[0] * scale + 400, v[1] * scale + 300];
        }

        function drawStars() {
            ctx.fillStyle = '#fff';
            for (const star of stars) {
                star.z -= 0.15;
                if (star.z < 1) star.z = 500;
                const sx = (star.x / star.z) * 200 + 400;
                const sy = (star.y / star.z) * 200 + 300;
                if (sx >= 0 && sx < 800 && sy >= 0 && sy < 600) {
                    const brightness = Math.min(255, Math.floor(300 / star.z * 50));
                    ctx.fillStyle = `rgb(${brightness},${brightness},${brightness})`;
                    ctx.fillRect(sx, sy, 1.5, 1.5);
                }
            }
        }

        let enemyZ = 500;
        let enemyX = 0, enemyY = 0;
        let enemyDX = 0.3, enemyDY = 0.2;

        function drawCockpit() {
            ctx.strokeStyle = themeColor;
            ctx.fillStyle = themeColor;
            ctx.lineWidth = 2;

            const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
            const drawVerticalMeter = (x, y, w, h, label, value, ticks = 4) => {
                ctx.strokeRect(x, y, w, h);
                const fillHeight = h * clamp(value, 0, 1);
                ctx.fillRect(x + 3, y + h - fillHeight + 3, w - 6, Math.max(fillHeight - 6, 0));
                for (let i = 1; i < ticks; i++) {
                    const ty = y + (h / ticks) * i;
                    ctx.beginPath();
                    ctx.moveTo(x - 4, ty);
                    ctx.lineTo(x + w + 4, ty);
                    ctx.stroke();
                }
                ctx.fillText(label, x - 2, y - 6);
            };
            const drawHorizontalMeter = (x, y, w, h, label, value) => {
                ctx.strokeRect(x, y, w, h);
                ctx.fillRect(x + 3, y + 3, Math.max((w - 6) * clamp(value, 0, 1), 0), h - 6);
                ctx.fillText(label, x, y - 4);
            };

            const roll = shipRotY;
            const pitch = shipRotX;
            const yawInput = inputY;
            const pitchInput = inputX;
            const motion = Math.abs(yawInput) + Math.abs(pitchInput);
            const altitude = clamp(0.5 + pitch * 0.12 - yawInput * 0.18 + Math.sin(Date.now() * 0.0015) * 0.08, 0, 1);
            const speed = clamp(0.58 + motion * 4 + Math.abs(roll) * 0.05, 0.12, 1);
            const fuel = clamp(0.82 - motion * 1.2 - Math.abs(pitch) * 0.015 + Math.cos(Date.now() * 0.0006) * 0.03, 0.15, 0.95);
            const energy = clamp(0.45 + Math.abs(roll) * 0.04 + Math.abs(pitchInput) * 3 + Math.sin(Date.now() * 0.0022 + roll) * 0.12, 0.1, 1);
            const frontShield = clamp(0.78 - Math.abs(yawInput) * 4 + Math.cos(Date.now() * 0.002 + roll) * 0.08, 0.08, 1);
            const rearShield = clamp(0.74 - Math.abs(pitchInput) * 4 + Math.sin(Date.now() * 0.0024 + pitch) * 0.08, 0.08, 1);
            const cabinTemp = clamp(0.35 + Math.abs(pitch) * 0.05 + motion * 2 + Math.sin(Date.now() * 0.002 + pitch) * 0.08, 0.05, 1);
            const laserTemp = clamp(0.28 + Math.abs(roll) * 0.05 + motion * 2.6 + Math.cos(Date.now() * 0.0025 + yawInput) * 0.08, 0.05, 1);

            // Ikkunakehys - trapetsi
            ctx.beginPath();
            ctx.moveTo(100, 80);
            ctx.lineTo(700, 80);
            ctx.lineTo(750, 420);
            ctx.lineTo(50, 420);
            ctx.closePath();
            ctx.stroke();

            // Keskiviiva
            ctx.beginPath();
            ctx.moveTo(400, 420);
            ctx.lineTo(400, 580);
            ctx.stroke();

            // Konsoli alaosa
            ctx.beginPath();
            ctx.moveTo(50, 420);
            ctx.lineTo(0, 600);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(750, 420);
            ctx.lineTo(800, 600);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(50, 420);
            ctx.lineTo(750, 420);
            ctx.stroke();

            ctx.lineWidth = 1;
            ctx.font = '10px Courier New';

            // Horisontti ja keskisuuntaus
            const horizonY = 250 + pitch * 220;
            const horizonTilt = roll * 90;
            ctx.beginPath();
            ctx.moveTo(280, horizonY - horizonTilt);
            ctx.lineTo(520, horizonY + horizonTilt);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(335, 250);
            ctx.lineTo(360, 250);
            ctx.moveTo(440, 250);
            ctx.lineTo(465, 250);
            ctx.stroke();

            // Tähtäin keskellä
            ctx.beginPath();
            ctx.moveTo(390, 250);
            ctx.lineTo(410, 250);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(400, 240);
            ctx.lineTo(400, 260);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(400, 250, 18 + motion * 80, 0, Math.PI * 2);
            ctx.stroke();

            // Radar/skanneri alaosassa
            ctx.beginPath();
            ctx.ellipse(400, 520, 100, 40, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(400, 520, 60, 24, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(300, 520);
            ctx.lineTo(500, 520);
            ctx.moveTo(400, 480);
            ctx.lineTo(400, 560);
            ctx.stroke();
            const radarAngle = Date.now() * 0.003 + roll * 0.7;
            ctx.beginPath();
            ctx.moveTo(400, 520);
            ctx.lineTo(400 + Math.cos(radarAngle) * 100, 520 + Math.sin(radarAngle) * 40);
            ctx.stroke();
            const radarTargetX = clamp(400 + yawInput * 900, 320, 480);
            const radarTargetY = clamp(520 + pitchInput * 700, 490, 550);
            ctx.beginPath();
            ctx.arc(radarTargetX, radarTargetY, 4, 0, Math.PI * 2);
            ctx.stroke();

            // Vasen puoli: nopeus + korkeus
            drawVerticalMeter(65, 455, 15, 80, 'SPD', speed);
            drawVerticalMeter(92, 455, 15, 80, 'ALT', altitude);

            // Oikea puoli: energia + polttoaine
            drawVerticalMeter(683, 455, 15, 80, 'ENR', energy);
            drawVerticalMeter(710, 455, 15, 80, 'FUL', fuel);

            // Kompassi / heading indicator
            const compassX = 400;
            const compassY = 444;
            const compassRadius = 22;
            ctx.beginPath();
            ctx.arc(compassX, compassY, compassRadius, 0, Math.PI * 2);
            ctx.stroke();
            const compassMarks = ['N', 'E', 'S', 'W'];
            for (let i = 0; i < compassMarks.length; i++) {
                const ang = shipRotY + i * (Math.PI / 2) - Math.PI / 2;
                const tx = compassX + Math.cos(ang) * (compassRadius - 7);
                const ty = compassY + Math.sin(ang) * (compassRadius - 7) + 3;
                ctx.fillText(compassMarks[i], tx - 3, ty);
            }
            ctx.beginPath();
            ctx.moveTo(compassX, compassY - 30);
            ctx.lineTo(compassX - 5, compassY - 22);
            ctx.lineTo(compassX + 5, compassY - 22);
            ctx.closePath();
            ctx.stroke();

            // Shieldit
            drawHorizontalMeter(295, 446, 90, 12, 'FS', frontShield);
            drawHorizontalMeter(415, 446, 90, 12, 'RS', rearShield);

            // Vasen/oikea paneelit
            for (let i = 0; i < 4; i++) {
                ctx.strokeRect(100 + i * 35, 460, 30, 12);
                ctx.strokeRect(560 + i * 35, 460, 30, 12);
            }
            ctx.fillText('FS', 105, 490);
            ctx.fillText('AS', 140, 490);
            ctx.fillText('FL', 175, 490);
            ctx.fillText('CT', 210, 490);

            ctx.fillText('LT', 565, 490);
            ctx.fillText('AL', 600, 490);
            ctx.fillText('MS', 635, 490);
            ctx.fillText('EC', 670, 490);

            // Paneelien täyttöarvot
            ctx.fillRect(103, 463, 24 * frontShield, 6);
            ctx.fillRect(138, 463, 24 * altitude, 6);
            ctx.fillRect(173, 463, 24 * fuel, 6);
            ctx.fillRect(208, 463, 24 * cabinTemp, 6);
            ctx.fillRect(563, 463, 24 * laserTemp, 6);
            ctx.fillRect(598, 463, 24 * clamp((altitude + energy) * 0.5, 0, 1), 6);
            ctx.fillRect(633, 463, 24 * speed, 6);
            ctx.fillRect(668, 463, 24 * energy, 6);

            // Lämpömittarit
            drawHorizontalMeter(135, 510, 95, 10, 'CABIN TEMP', cabinTemp);
            drawHorizontalMeter(570, 510, 95, 10, 'LASER TEMP', laserTemp);

            // Lisätekstit ja liikedata
            ctx.fillText(`P:${(pitch * 57.3).toFixed(0)}`, 112, 550);
            ctx.fillText(`R:${(roll * 57.3).toFixed(0)}`, 112, 565);
            ctx.fillText(`HDG ${(((shipRotY * 180 / Math.PI) % 360) + 360).toFixed(0)}`, 354, 474);
            ctx.fillText(`VCTR ${(motion * 100).toFixed(0)}`, 610, 565);
        }

        let terrainOffset = 0;

        function drawTerrain() {
            const windowTop = 80;
            const windowBottom = 420;
            const horizonY = 245 + shipRotX * 18 + inputX * 220;
            const centerX = 400 - shipRotY * 140 - inputY * 380;
            const cols = 12;
            const rows = 20;
            const spacing = 70;
            const depthStep = 55;
            const depthScroll = terrainOffset % depthStep;
            const rowData = [];

            terrainOffset += 0.8;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(100, windowTop);
            ctx.lineTo(700, windowTop);
            ctx.lineTo(750, windowBottom);
            ctx.lineTo(50, windowBottom);
            ctx.closePath();
            ctx.clip();

            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 1;

            for (let row = 0; row < rows; row++) {
                let worldZ = 120 + row * depthStep - depthScroll;
                if (worldZ < 60) worldZ += rows * depthStep;

                const points = [];
                for (let col = 0; col < cols; col++) {
                    const worldX = (col - (cols - 1) / 2) * spacing + shipRotY * 220;
                    const sampleZ = worldZ + terrainOffset * 3;
                    const height = Math.sin(worldX * 0.018 + sampleZ * 0.012) * 20 + Math.cos(sampleZ * 0.02 - worldX * 0.01) * 12;
                    const scale = 320 / (worldZ + 80);
                    const screenX = centerX + worldX * scale;
                    const screenY = horizonY + (82 - height + shipRotX * 90) * scale;
                    points.push([screenX, screenY]);
                }
                rowData.push({ z: worldZ, points });
            }

            rowData.sort((a, b) => b.z - a.z);

            for (let row = 0; row < rowData.length; row++) {
                const currentRow = rowData[row].points;
                for (let col = 0; col < currentRow.length - 1; col++) {
                    const a = currentRow[col];
                    const b = currentRow[col + 1];
                    if (a[1] >= 210 || b[1] >= 210) {
                        ctx.beginPath();
                        ctx.moveTo(a[0], a[1]);
                        ctx.lineTo(b[0], b[1]);
                        ctx.stroke();
                    }
                }

                if (row < rowData.length - 1) {
                    const nextRow = rowData[row + 1].points;
                    for (let col = 0; col < currentRow.length; col++) {
                        const a = currentRow[col];
                        const b = nextRow[col];
                        if (a[1] >= 210 || b[1] >= 210) {
                            ctx.beginPath();
                            ctx.moveTo(a[0], a[1]);
                            ctx.lineTo(b[0], b[1]);
                            ctx.stroke();
                        }
                    }
                }
            }

            ctx.restore();
        }

        // Toinen alus joka lentää cockpit-näkymässä
        function drawEnemyShip() {
            // Vihollisalus liikkuu + reagoi pelaajan ohjaukseen
            enemyX += enemyDX - inputY * 5;
            enemyY += enemyDY - inputX * 5;
            enemyZ -= 0.3;

            if (enemyZ < 50) { enemyZ = 500; enemyX = (Math.random()-0.5)*200; enemyY = (Math.random()-0.5)*100; }
            if (Math.abs(enemyX) > 150) enemyDX = -enemyDX;
            if (Math.abs(enemyY) > 80) enemyDY = -enemyDY;

            const fov = 300;
            const scale = fov / enemyZ;

            const eVerts = ship.vertices.map(v => {
                let rv = rotateY(v, angleY * 2);
                rv = rotateX(rv, angleX * 1.5);
                return [
                    (rv[0] + enemyX) * scale + 400,
                    (rv[1] + enemyY) * scale + 250
                ];
            });

            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 1.5;
            ctx.shadowColor = themeColor;
            ctx.shadowBlur = 2;

            for (const [a, b] of ship.edges) {
                if (eVerts[a] && eVerts[b]) {
                    ctx.beginPath();
                    ctx.moveTo(eVerts[a][0], eVerts[a][1]);
                    ctx.lineTo(eVerts[b][0], eVerts[b][1]);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;
        }

        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 800, 600);

            updateInput();
            drawStars();

            angleX += 0.004;
            angleY += 0.006;
            angleZ += 0.002;

            if (cockpitView) {
                drawTerrain();
                drawCockpit();
            } else {
                const projected = ship.vertices.map(v => {
                    let rv = rotateX(v, angleX + shipRotX);
                    rv = rotateY(rv, angleY + shipRotY);
                    rv = rotateZ(rv, angleZ);
                    return project(rv);
                });

                ctx.strokeStyle = themeColor;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = themeColor;
                ctx.shadowBlur = 2;

                for (const [a, b] of ship.edges) {
                    const pa = projected[a];
                    const pb = projected[b];
                    if (pa && pb) {
                        ctx.beginPath();
                        ctx.moveTo(pa[0], pa[1]);
                        ctx.lineTo(pb[0], pb[1]);
                        ctx.stroke();
                    }
                }
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
